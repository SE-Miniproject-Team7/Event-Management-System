name: EMS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/ems_test_ci?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Start MongoDB replica set for transaction tests
        run: |
          docker run -d --name ems-mongodb -p 27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec ems-mongodb mongosh --quiet --eval 'db.adminCommand("ping").ok' | grep -q 1; then
              break
            fi
            sleep 1
          done
          docker exec ems-mongodb mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 30); do
            if docker exec ems-mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              exit 0
            fi
            sleep 1
          done
          echo "MongoDB replica set did not become primary" >&2
          exit 1
      - name: Verify concurrent registration capacity and FIFO waitlist
        run: node --test tests/registrations.concurrent.integration.cjs
      - name: Verify event audit and notification transactions
        run: node --test tests/audit.integration.cjs tests/notifications.integration.cjs
      - name: Measure service coverage
        run: npm run test:coverage
      - name: Upload service coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-service-coverage
          path: backend/coverage/
          if-no-files-found: warn
          retention-days: 14
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
