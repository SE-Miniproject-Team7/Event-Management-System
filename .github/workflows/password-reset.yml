name: Password reset integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reset-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  password-reset:
    name: Password reset MongoDB integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      CLIENT_ORIGIN: http://localhost:5173
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/ems_test_reset_ci?replicaSet=rs0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Start MongoDB replica set
        run: |
          docker run -d --name ems-reset-mongo -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec ems-reset-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1; then
              break
            fi
            sleep 2
          done
          docker exec ems-reset-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec ems-reset-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set failed to become primary" >&2
          exit 1
      - name: Verify reset expiry, single use and transactional rollback
        run: npm run test:reset
      - name: Remove disposable MongoDB
        if: always()
        run: docker rm -f ems-reset-mongo
